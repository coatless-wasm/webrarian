<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-vfs-files" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Each bundled file keeps its path from your collection to the browser</title>
  <desc id="d">Three places hold the same two files, left to right. In your collection, a project folder, they are analysis.R and data/survey.csv. bind() copies each one into the site, drawn as a host's server, as vfs-files/analysis.R and vfs-files/data/survey.csv. When the page opens it fetches each file into the browser's file system, drawn as a browser window, as /home/web_user/analysis.R and /home/web_user/data/survey.csv, where R starts.</desc>
