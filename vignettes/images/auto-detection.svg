<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-auto-detection" viewBox="0 0 626 314" role="img" aria-labelledby="t d">
  <title id="t">catalog() fills in the packages and files it finds in your project</title>
  <desc id="d">Left, a project folder as a file tree, my-analysis, holding analysis.R, helpers.R, import.R and data/sales.csv. Beside each R file is a line from it: library(dplyr), library(stringr) and readr::read_csv(path). Right, the _webrarian.yml that catalog() writes, listing dplyr, readr and stringr under packages and the patterns *.R and data/ under files. Matching highlights link each package and file pattern to where it was found.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  <rect x="0.5" y="0.5" width="625" height="313" rx="14" fill="#FBF7EE" stroke="#E6DCC6"/>

  <!-- before: the folder catalog() reads -->
  <rect x="16" y="16" width="340" height="282" rx="12" fill="#FFFFFF" stroke="#E6DCC6" stroke-width="1"/>
  <text class="s" x="34" y="46" font-size="16" fill="#2A2620" font-weight="700">Your project</text>
  <text class="s" x="34" y="66" font-size="12.5" fill="#6E6656">the R files and data you already have</text>
  <path d="M36,109.1 v-10 h4.9 l1.8,2 h6.3 v8 z" fill="#D9A441"/>
  <text class="m" x="54" y="108" font-size="11.5" fill="#2A2620" textLength="82.8">my-analysis/</text>
  <rect x="67" y="123.5" width="75" height="16" rx="3" fill="#DCE6EF"/>
  <path d="M53,135.6 v-10.5 h5.2 l3.1,3.1 v7.3 z M58.2,125.1 v3.1 h3.1" fill="none" stroke="#8B8371" stroke-width="1"/>
  <text class="m" x="70" y="134" font-size="11.5" fill="#2A2620" textLength="69">analysis.R</text>
  <rect x="67" y="149.5" width="68.1" height="16" rx="3" fill="#DCE6EF"/>
  <path d="M53,161.6 v-10.5 h5.2 l3.1,3.1 v7.3 z M58.2,151.1 v3.1 h3.1" fill="none" stroke="#8B8371" stroke-width="1"/>
  <text class="m" x="70" y="160" font-size="11.5" fill="#2A2620" textLength="62.1">helpers.R</text>
  <rect x="67" y="175.5" width="61.2" height="16" rx="3" fill="#DCE6EF"/>
  <path d="M53,187.6 v-10.5 h5.2 l3.1,3.1 v7.3 z M58.2,177.1 v3.1 h3.1" fill="none" stroke="#8B8371" stroke-width="1"/>
  <text class="m" x="70" y="186" font-size="11.5" fill="#2A2620" textLength="55.2">import.R</text>
  <rect x="67" y="201.5" width="40.5" height="16" rx="3" fill="#DCE6EF"/>
  <path d="M52,213.1 v-10 h4.9 l1.8,2 h6.3 v8 z" fill="#D9A441"/>
  <text class="m" x="70" y="212" font-size="11.5" fill="#2A2620" textLength="34.5">data/</text>
  <path d="M69,239.6 v-10.5 h5.2 l3.1,3.1 v7.3 z M74.2,229.1 v3.1 h3.1" fill="none" stroke="#8B8371" stroke-width="1"/>
  <text class="m" x="86" y="238" font-size="11.5" fill="#2A2620" textLength="62.1">sales.csv</text>
  <path d="M40.5,111.1 V208.1 M40.5,130.1 H49 M40.5,156.1 H49 M40.5,182.1 H49 M40.5,208.1 H49" fill="none" stroke="#C9BB9D" stroke-width="1.1"/>
  <path d="M56.5,215.1 V234.1 M56.5,234.1 H65" fill="none" stroke="#C9BB9D" stroke-width="1.1"/>

  <!-- a line from each R file, with the package it names -->
  <path d="M147.0,130 H158" fill="none" stroke="#DED8CA" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/>
  <rect x="166" y="118" width="120.6" height="24" rx="6" fill="#FBF7EE" stroke="#E6DCC6" stroke-width="1"/>
  <rect x="230.7" y="123.5" width="39.5" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="134" font-size="11.5" xml:space="preserve"><tspan x="178" textLength="55.2" fill="#2A2620">library(</tspan><tspan x="233.2" textLength="34.5" fill="#2A2620">dplyr</tspan><tspan x="267.7" fill="#2A2620">)</tspan></text>
  <path d="M140.1,156 H158" fill="none" stroke="#DED8CA" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/>
  <rect x="166" y="144" width="134.4" height="24" rx="6" fill="#FBF7EE" stroke="#E6DCC6" stroke-width="1"/>
  <rect x="230.7" y="149.5" width="53.3" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="160" font-size="11.5" xml:space="preserve"><tspan x="178" textLength="55.2" fill="#2A2620">library(</tspan><tspan x="233.2" textLength="48.3" fill="#2A2620">stringr</tspan><tspan x="281.5" fill="#2A2620">)</tspan></text>
  <path d="M133.2,182 H158" fill="none" stroke="#DED8CA" stroke-width="1.2" stroke-dasharray="1 4" stroke-linecap="round"/>
  <rect x="166" y="170" width="168.9" height="24" rx="6" fill="#FBF7EE" stroke="#E6DCC6" stroke-width="1"/>
  <rect x="175.5" y="175.5" width="39.5" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="186" font-size="11.5" xml:space="preserve"><tspan x="178" textLength="34.5" fill="#2A2620">readr</tspan><tspan x="212.5" textLength="110.4" fill="#2A2620">::read_csv(path)</tspan></text>

  <!-- catalog() -->
  <circle cx="393" cy="149" r="18" fill="#B84130"/>
  <path d="M385.5,149.0 h14 m-5.5,-6 l6,6 l-6,6" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="m" x="393" y="187" font-size="12" fill="#B84130" font-weight="600" text-anchor="middle" textLength="64.8">catalog()</text>

  <!-- after: the settings it writes -->
  <rect x="430" y="16" width="180" height="282" rx="12" fill="#FFFFFF" stroke="#E6DCC6" stroke-width="1"/>
  <text class="m" x="448" y="46" font-size="16" fill="#2A2620" font-weight="700" textLength="134.4">_webrarian.yml</text>
  <text class="s" x="448" y="66" font-size="12.5" fill="#6E6656">what catalog() writes</text>
  <text class="m" y="98" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="62.1" fill="#62291F">packages:</tspan></text>
  <text class="m" y="117.5" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="75.9" fill="#62291F">  prebuilt:</tspan></text>
  <rect x="490.9" y="126.5" width="39.5" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="137" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#6E6656">    - </tspan><tspan x="493.4" textLength="34.5" fill="#2A2620">dplyr</tspan></text>
  <rect x="490.9" y="146" width="39.5" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="156.5" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#6E6656">    - </tspan><tspan x="493.4" textLength="34.5" fill="#2A2620">readr</tspan></text>
  <rect x="490.9" y="165.5" width="53.3" height="16" rx="3" fill="#F4D9D2"/>
  <text class="m" y="176" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#6E6656">    - </tspan><tspan x="493.4" textLength="48.3" fill="#2A2620">stringr</tspan></text>
  <text class="m" y="195.5" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#62291F">files:</tspan></text>
  <text class="m" y="215" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="69" fill="#62291F">  include:</tspan></text>
  <rect x="490.9" y="224" width="39.5" height="16" rx="3" fill="#DCE6EF"/>
  <text class="m" y="234.5" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#6E6656">    - </tspan><tspan x="493.4" textLength="34.5" fill="#2A2620">"*.R"</tspan></text>
  <rect x="490.9" y="243.5" width="39.5" height="16" rx="3" fill="#DCE6EF"/>
  <text class="m" y="254" font-size="11.5" xml:space="preserve"><tspan x="452" textLength="41.4" fill="#6E6656">    - </tspan><tspan x="493.4" textLength="34.5" fill="#2A2620">data/</tspan></text>

  <!-- key -->
  <rect x="450" y="274" width="12" height="12" rx="2" fill="#F4D9D2"/>
  <text class="s" x="468" y="284" font-size="12" fill="#6E6656">packages</text>
  <rect x="538" y="274" width="12" height="12" rx="2" fill="#DCE6EF"/>
  <text class="s" x="556" y="284" font-size="12" fill="#6E6656">files</text>
</svg>
