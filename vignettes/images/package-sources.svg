<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-package-sources" viewBox="0 0 720 384" role="img" aria-labelledby="t d">
  <title id="t">Three package sources feed one webrarian site, and only GitHub and local packages need Docker</title>
  <desc id="d">Prebuilt packages come off a shelf of WebAssembly binaries at repo.r-wasm.org or an r-universe and go straight to the site, with no Docker. Packages from GitHub (owner/repo) or a local directory (../mypackage) first go through Docker, which compiles them in the webR container. Every package ends up on the same shelf, the site's repo/, and is installed when the page opens.</desc>
