<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-webr-browser" viewBox="0 0 720 553" role="img" aria-labelledby="t d">
  <title id="t">The webrarian workspace in a browser</title>
  <desc id="d">A browser window at my-analysis.netlify.app showing the workspace. The editor holds analysis.R, with Run, Run All and Share. The console below it has installed dplyr and ggplot2, added two files and echoed the script after Run All, with a Restart R button. The Files tab shows the file tree under web_user, with data/sales.csv and analysis.R. The Plots tab shows a bar chart of counts by region. The footer says edits are kept in this browser and offers Reset files. Numbered callouts match a legend under the window.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
  <rect x="0.5" y="0.5" width="719" height="552" rx="14" fill="#FBF7EE" stroke="#E6DCC6"/>

