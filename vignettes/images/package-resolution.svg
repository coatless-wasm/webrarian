<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-package-resolution" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
  <title id="t">Repositories are searched in order, and the first one with the package wins</title>
  <desc id="d">A request for somepackage checks three repository shelves in order. The first, repo.r-wasm.org, does not have it. The second, myname.r-universe.dev from packages.repos, does, so its copy is used. The third, wasm.example.com/repo, is never asked.</desc>
