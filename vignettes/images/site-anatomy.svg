<svg xmlns="http://www.w3.org/2000/svg" id="webrarian-site-anatomy" viewBox="0 0 720 440" role="img" aria-labelledby="t d">
  <title id="t">The rooms of _site/, drawn as a floor plan</title>
  <desc id="d">A blueprint of the _site/ folder, with room sizes roughly matching file sizes for a site with dplyr and ggplot2. The largest room is webr/v0.6.0/, the webR engine, at 45.1M. Beside it are repo/, the packages and their index, and library/, the same packages installed as one image, 38M together. Along the front are index.html, the page with its settings written in, where visitors enter; exlibris-r.&lt;hash&gt;.js and .css, the workspace; vfs-files/, your files; and a small room for _headers, sw.js, LICENSES/, packages.json, assets/ and .webrarian-build.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}</style>
