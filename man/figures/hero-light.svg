  <text class="m ink" x="329.4" y="188" font-size="11">repo/</text>
  <path class="folder" d="M312,207 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="329.4" y="206" font-size="11">library/</text>
  <path class="folder" d="M312,225 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="329.4" y="224" font-size="11">vfs-files/</text>
  <path class="file-s" d="M327,243.5 v-10 h5 l3,3 v7 z M332,233.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="343.4" y="242" font-size="11">analysis.R</text>
  <path class="folder" d="M326,261 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="343.4" y="260" font-size="11">data/</text>
  <path class="file-s" d="M341,279.5 v-10 h5 l3,3 v7 z M346,269.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="357.4" y="278" font-size="11">sales.csv</text>
  <text class="m faint" x="312" y="293" font-size="11">…</text>
  <path class="rail-s" d="M302.3,101 V292.3 M302.3,112.3 H309 M302.3,130.3 H309 M302.3,148.3 H309 M302.3,166.3 H309 M302.3,184.3 H309 M302.3,202.3 H309 M302.3,220.3 H309 M302.3,292.3 H309" stroke-width="1.1"/>
  <path class="rail-s" d="M316.3,227 V256.3 M316.3,238.3 H323 M316.3,256.3 H323" stroke-width="1.1"/>
  <path class="rail-s" d="M330.3,263 V274.3 M330.3,274.3 H337" stroke-width="1.1"/>

  <!-- any static host -->
  <circle class="accent" cx="516" cy="169" r="17"/>
  <path class="onaccent-s" d="M509,169 h13 m-5,-5.5 l5.5,5.5 l-5.5,5.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="s accent" x="516" y="206" font-size="12.5" font-weight="600" text-anchor="middle">any host</text>

  <!-- 3. what readers get: the real workspace, in a browser -->
  <rect class="p3" x="548" y="16" width="396" height="318" rx="14"/>
  <text class="s p3ink" x="566" y="48" font-size="18" font-weight="700">Readers get</text>
  <text class="s p3muted" x="566" y="68" font-size="12.5">live R in their browser</text>
  <rect class="win" x="564" y="84" width="364" height="212" rx="8"/>
  <path class="tool" d="M564,92 a8,8 0 0 1 8,-8 H920 a8,8 0 0 1 8,8 V110 H564 Z"/>
  <circle class="dot" cx="577" cy="97" r="3.2"/>
  <circle class="dot" cx="587" cy="97" r="3.2"/>
  <circle class="dot" cx="597" cy="97" r="3.2"/>
  <rect class="addr" x="612" y="89" width="304" height="16" rx="8"/>
  <rect class="addredge-s" x="612.5" y="89.5" width="303" height="15" rx="7.5"/>
  <path class="wfile-s" d="M622,101 v-4.5 h6 v4.5 z M623.2,96.5 v-1.6 a1.8,1.8 0 0 1 3.6,0 v1.6" stroke-width="1"/>
  <text class="s wmut" x="634" y="100.5" font-size="8.5">you.github.io/my-analysis/</text>
  <path class="addredge-s" d="M564,110 H928" stroke-width="1"/>

  <!-- editor: file tab, Run, Run All, Share -->
  <rect class="hdr" x="564" y="110" width="204" height="15"/>
  <rect class="tabon" x="564" y="110" width="50" height="15"/>
  <rect class="tabline" x="564" y="123" width="50" height="2"/>
  <text class="s wink" x="571" y="120.5" font-size="7.5">analysis.R</text>
  <text class="s wmut" x="622" y="121" font-size="9">+</text>
  <rect class="btn-s" x="728.9" y="112.9" width="33.7" height="9.2" rx="1.8" stroke-width="0.8"/>
  <path class="wglyph-s" d="M736.5,115.3 L733.5,117.5 L736.5,119.7" stroke-width="0.6"/>
  <circle class="wink" cx="736.5" cy="115.3" r="1"/>
  <circle class="wink" cx="733.5" cy="117.5" r="1"/>
  <circle class="wink" cx="736.5" cy="119.7" r="1"/>
  <text class="s wink" x="749" y="120" font-size="6.5" text-anchor="middle">Share</text>
  <rect class="btn-s" x="687.4" y="112.9" width="37.7" height="9.2" rx="1.8" stroke-width="0.8"/>
  <path class="wink" d="M691.6,114.9 h2.4 l1.4,1.4 v3.8 h-3.8 z"/>
  <text class="s wink" x="709.5" y="120" font-size="6.5" text-anchor="middle">Run All</text>
  <rect class="btn-s" x="656.4" y="112.9" width="27.2" height="9.2" rx="1.8" stroke-width="0.8"/>
  <path class="wink" d="M660.5,115.2 l3.8,2.3 l-3.8,2.3 z"/>
  <text class="s wink" x="673.2" y="120" font-size="6.5" text-anchor="middle">Run</text>
  <path class="wline-s" d="M652,110 V125" stroke-width="0.8"/>
  <path class="wline-s" d="M564,125 H768" stroke-width="1"/>
  <rect class="hdr" x="564" y="125.5" width="15" height="70.5"/>
  <path class="wline-s" d="M579,125 V196" stroke-width="1"/>
  <text class="m wmut" x="575" y="138" font-size="7" text-anchor="end">1</text>
  <text class="m" x="582" y="138" font-size="8" xml:space="preserve"><tspan class="tfn">library</tspan><tspan class="wink">(dplyr)</tspan></text>
  <text class="m wmut" x="575" y="148.5" font-size="7" text-anchor="end">2</text>
  <text class="m" x="582" y="148.5" font-size="8" xml:space="preserve"><tspan class="tfn">library</tspan><tspan class="wink">(ggplot2)</tspan></text>
  <text class="m wmut" x="575" y="159" font-size="7" text-anchor="end">3</text>
  <text class="m" x="582" y="159" font-size="8" xml:space="preserve"><tspan class="wink">sales </tspan><tspan class="topr">&lt;-</tspan><tspan class="wink"> </tspan><tspan class="tfn">read.csv</tspan><tspan class="wink">(</tspan><tspan class="tstr">"data/sales.csv"</tspan><tspan class="wink">)</tspan></text>
  <text class="m wmut" x="575" y="169.5" font-size="7" text-anchor="end">4</text>
  <text class="m" x="582" y="169.5" font-size="8" xml:space="preserve"><tspan class="wink">sales |&gt; </tspan><tspan class="tfn">count</tspan><tspan class="wink">(region) |&gt;</tspan></text>
  <text class="m wmut" x="575" y="180" font-size="7" text-anchor="end">5</text>
  <text class="m" x="582" y="180" font-size="8" xml:space="preserve"><tspan class="wink">  </tspan><tspan class="tfn">ggplot</tspan><tspan class="wink">(</tspan><tspan class="tfn">aes</tspan><tspan class="wink">(n, region)) </tspan><tspan class="topr">+</tspan></text>
  <text class="m wmut" x="575" y="190.5" font-size="7" text-anchor="end">6</text>
  <text class="m" x="582" y="190.5" font-size="8" xml:space="preserve"><tspan class="wink">  </tspan><tspan class="tfn">geom_col</tspan><tspan class="wink">(</tspan><tspan class="tfn">fill =</tspan><tspan class="wink"> </tspan><tspan class="tstr">"#B84130"</tspan><tspan class="wink">)</tspan></text>

  <!-- console: Terminal, ~/web_user, Restart R -->
  <path class="wline-s" d="M564,196 H768" stroke-width="1.2"/>
  <rect class="hdr" x="564" y="196.6" width="204" height="15"/>
  <text class="s wink" x="571" y="207" font-size="7.5" font-weight="700">Terminal</text>
  <text class="m wmut" x="611" y="207" font-size="7.5">~/web_user</text>
  <rect class="btn-s" x="723.4" y="199.4" width="39.2" height="9.2" rx="1.8" stroke-width="0.8"/>
  <text class="s wink" x="743" y="206.5" font-size="6.5" text-anchor="middle">Restart R</text>
  <path class="wline-s" d="M564,211.6 H768" stroke-width="1"/>
  <text class="m" x="571" y="222" font-size="8" xml:space="preserve"><tspan class="wink">&gt; library(dplyr)</tspan></text>
  <text class="m" x="571" y="231.5" font-size="8" xml:space="preserve"><tspan class="wink">+ library(ggplot2)</tspan></text>
  <text class="m" x="571" y="241" font-size="8" xml:space="preserve"><tspan class="wink">+ sales &lt;- read.csv("data/sales.csv")</tspan></text>
  <text class="m" x="571" y="250.5" font-size="8" xml:space="preserve"><tspan class="wink">+ sales |&gt; count(region) |&gt;</tspan></text>
  <text class="m" x="571" y="260" font-size="8" xml:space="preserve"><tspan class="wink">+   ggplot(aes(n, region)) +</tspan></text>
  <text class="m" x="571" y="269.5" font-size="8" xml:space="preserve"><tspan class="wink">+   geom_col(fill = "#B84130")</tspan></text>
  <text class="m" x="571" y="279" font-size="8" xml:space="preserve"><tspan class="wink">&gt; </tspan></text>

