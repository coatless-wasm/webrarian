<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d">
  <title id="t">Bundle an R project into a static site that runs R in the browser</title>
  <desc id="d">You write a folder with R files, data and a list of packages. bind() builds it into _site/, one static folder with the page, the workspace, the webR engine, the packages and your files. Readers open it from any static host and get a live R workspace in their browser, with an editor, a console, your files and plots, and nothing to install.</desc>
  <style>.s{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.card{fill:#FBF7EE}.ink{fill:#2A2620}.muted{fill:#6E6656}.faint{fill:#8B8371}.code{fill:#F1E8D4}.key{fill:#62291F}.str{fill:#3B5B4B}.com{fill:#6E6656}.accent{fill:#B84130}.p3{fill:#2A2620}.p3ink{fill:#F8F1E0}.p3muted{fill:#BFB6A5}.folder{fill:#D9A441}.win{fill:#FFFFFF}.tool{fill:#E4DAC5}.addr{fill:#FFFFFF}.hdr{fill:#F5F5F5}.tabon{fill:#FFFFFF}.tabline{fill:#0066CC}.wink{fill:#111111}.wmut{fill:#666666}.wfolder{fill:#E8A87C}.bar{fill:#B84130}.dot{fill:#C8BA9C}.gpanel{fill:#EBEBEB}.tfn{fill:#116329}.topr{fill:#005CC5}.tstr{fill:#032F62}.edge-s{stroke:#E6DCC6;fill:none}.rail-s{stroke:#C9BB9D;fill:none}.file-s{stroke:#8B8371;fill:none}.onaccent-s{stroke:#FFFFFF;fill:none}.winedge-s{stroke:#2A2620;fill:none}.addredge-s{stroke:#D8CEB8;fill:none}.wline-s{stroke:#DDDDDD;fill:none}.btn-s{stroke:#DDDDDD;fill:none}.wfile-s{stroke:#666666;fill:none}.wglyph-s{stroke:#111111;fill:none}.ggrid-s{stroke:#FFFFFF;fill:none}.gtick-s{stroke:#333333;fill:none}.wrail-s{stroke:#B0B0B0;fill:none}</style>

  <!-- 1. the folder you write -->
  <rect class="card" x="16" y="16" width="200" height="318" rx="14"/>
  <rect class="edge-s" x="16.5" y="16.5" width="199" height="317" rx="14"/>
  <text class="s ink" x="34" y="48" font-size="18" font-weight="700">You write</text>
  <text class="s muted" x="34" y="68" font-size="12.5">R files, data and packages</text>
  <path class="folder" d="M34,99 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="51.4" y="98" font-size="11">my-analysis/</text>
  <path class="file-s" d="M49,117.5 v-10 h5 l3,3 v7 z M54,107.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="65.3" y="116" font-size="11">_webrarian.yml</text>
  <path class="file-s" d="M49,135.5 v-10 h5 l3,3 v7 z M54,125.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="65.3" y="134" font-size="11">analysis.R</text>
  <path class="folder" d="M48,153 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="65.3" y="152" font-size="11">data/</text>
  <path class="file-s" d="M63,171.5 v-10 h5 l3,3 v7 z M68,161.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="79.3" y="170" font-size="11">sales.csv</text>
  <path class="rail-s" d="M38.3,101 V148.3 M38.3,112.3 H45 M38.3,130.3 H45 M38.3,148.3 H45" stroke-width="1.1"/>
  <path class="rail-s" d="M52.3,155 V166.3 M52.3,166.3 H59" stroke-width="1.1"/>
  <rect class="code" x="32" y="184" width="168" height="138" rx="8"/>
  <text class="m" x="44" y="204" font-size="11" xml:space="preserve"><tspan class="com"># _webrarian.yml</tspan></text>
  <text class="m" x="44" y="217.5" font-size="11" xml:space="preserve"><tspan class="key">packages:</tspan></text>
  <text class="m" x="44" y="231" font-size="11" xml:space="preserve"><tspan class="key">  prebuilt:</tspan></text>
  <text class="m" x="44" y="244.5" font-size="11" xml:space="preserve"><tspan class="muted">    - </tspan><tspan class="str">dplyr</tspan></text>
  <text class="m" x="44" y="258" font-size="11" xml:space="preserve"><tspan class="muted">    - </tspan><tspan class="str">ggplot2</tspan></text>
  <text class="m" x="44" y="271.5" font-size="11" xml:space="preserve"><tspan class="key">files:</tspan></text>
  <text class="m" x="44" y="285" font-size="11" xml:space="preserve"><tspan class="key">  include:</tspan></text>
  <text class="m" x="44" y="298.5" font-size="11" xml:space="preserve"><tspan class="muted">    - </tspan><tspan class="str">"*.R"</tspan></text>
  <text class="m" x="44" y="312" font-size="11" xml:space="preserve"><tspan class="muted">    - </tspan><tspan class="str">data/</tspan></text>

  <!-- bind() -->
  <circle class="accent" cx="248" cy="169" r="17"/>
  <path class="onaccent-s" d="M241,169 h13 m-5,-5.5 l5.5,5.5 l-5.5,5.5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="m accent" x="248" y="206" font-size="12.5" font-weight="600" text-anchor="middle">bind()</text>

  <!-- 2. the static folder bind() writes -->
  <rect class="card" x="280" y="16" width="204" height="318" rx="14"/>
  <rect class="edge-s" x="280.5" y="16.5" width="203" height="317" rx="14"/>
  <text class="s ink" x="298" y="48" font-size="18" font-weight="700">bind() builds</text>
  <text class="s muted" x="298" y="68" font-size="12.5">one static folder</text>
  <path class="folder" d="M298,99 v-9.5 h4.7 l1.7,1.9 h5.9 v7.6 z"/>
  <text class="m ink" x="315.4" y="98" font-size="11">_site/</text>
  <path class="file-s" d="M313,117.5 v-10 h5 l3,3 v7 z M318,107.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="329.4" y="116" font-size="11">index.html</text>
  <path class="file-s" d="M313,135.5 v-10 h5 l3,3 v7 z M318,125.5 v3 h3" stroke-width="1"/>
  <text class="m ink" x="329.4" y="134" font-size="11">exlibris-r.&lt;hash&gt;.js</text>
