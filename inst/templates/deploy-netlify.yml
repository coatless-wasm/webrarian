# Build this webrarian collection and deploy it to Netlify.
# Generated by webrarian {{webrarian_version}} (circulate_via_netlify()).
#
# Netlify's build image has no R, so the site is built here and uploaded
# with the Netlify CLI. Add two repository secrets:
#   NETLIFY_AUTH_TOKEN  a personal access token (User settings > Applications)
#   NETLIFY_SITE_ID     the site's API ID (Site configuration > General)
name: Deploy webR site to Netlify

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "netlify-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run steps start in the collection's directory ("." when it is the
    # repository root), so --dir below is relative to it. hashFiles() starts
    # at the repository root, so the cache key includes the directory.
    defaults:
      run:
        working-directory: "{{workdir}}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install webrarian
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable")
          pak::pak("{{install_ref}}")
        shell: Rscript {0}

      - name: Cache webR downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: webrarian-${{ runner.os }}-${{ hashFiles('{{config_path}}') }}
          restore-keys: webrarian-${{ runner.os }}-

      # R_USER_CACHE_DIR is set on this step because a job's env cannot use
      # the runner context (GitHub would refuse to load the file).
      - name: Build the site
        run: webrarian::bind()
        shell: Rscript {0}
        env:
          R_USER_CACHE_DIR: ${{ runner.temp }}/r-user-cache

      # The site's _headers file (written by bind()) carries every response
      # header, cross-origin isolation included; netlify.toml next to
      # _webrarian.yml only names the publish directory.
      # --no-build: the step above already built the site. Without it the CLI
      # runs a Netlify build of the repository before uploading.
      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27 deploy --prod --dir="{{output_dir}}" --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
