# Build this webrarian collection and deploy it to GitHub Pages.
# Generated by webrarian {{webrarian_version}} (circulate_via_github()).
#
# Enable Pages once: repository Settings > Pages > Source: GitHub Actions.
# GitHub Pages cannot set response headers, so the site is not
# cross-origin isolated there: webR still runs, but Ctrl+C cannot interrupt
# R. Set `build: service-worker: true` in _webrarian.yml to cache the engine
# in visitors' browsers.
name: Deploy webR site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Read-only by default; only the deploy job below may write to Pages.
permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run steps start in the collection's directory ("." when it is the
    # repository root). hashFiles() and an action's `with:` paths start at the
    # repository root, so the cache key and the upload path include it.
    defaults:
      run:
        working-directory: "{{workdir}}"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The webrarian release that wrote this file, so the build reads
      # _webrarian.yml the way it was written.
      - name: Install webrarian
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable")
          pak::pak("{{install_ref}}")
        shell: Rscript {0}

      # The webR engine and package binaries webrarian downloads. Keyed on the
      # collection's config, so a new webR version or package list refills it.
      - name: Cache webR downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/r-user-cache
          key: webrarian-${{ runner.os }}-${{ hashFiles('{{config_path}}') }}
          restore-keys: webrarian-${{ runner.os }}-

      # Local and GitHub packages are compiled in Docker, which this runner has.
      # R_USER_CACHE_DIR is set on this step because a job's env cannot use the
      # runner context (GitHub would refuse to load the file).
      - name: Build the site
        run: webrarian::bind()
        shell: Rscript {0}
        env:
          R_USER_CACHE_DIR: ${{ runner.temp }}/r-user-cache

      # include-hidden-files: dot-files in vfs-files/ (an .Rprofile, say) and
      # the build marker must reach the site.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "{{site_path}}"
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
